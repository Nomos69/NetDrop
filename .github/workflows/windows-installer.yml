name: Build and publish Windows installer

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: powershell
        run: .\packaging\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NetDrop-Local-Setup
          path: dist/installer/NetDrop-Local-Setup.exe
      - name: Attach installer to GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:RELEASE_TAG" dist/installer/NetDrop-Local-Setup.exe --clobber
